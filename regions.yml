  # ── "Rest" buckets: one per area-Bundesland, catching kiosks outside the
  # explicit city bboxes above. Queried by ISO area filter (not bbox), and
  # ownsFeature gives city regions priority so existing city files don't
  # shed features. Stadtstaaten (Berlin, Hamburg, Bremen) are already fully
  # covered by their city entries — no rest bucket needed. Prefix convention:
  # `<2-letter ISO code>r` (e.g. nwr for DE-NW). Bboxes are Bundesland
  # envelopes — only used by ownsFeature for membership; the Overpass query
  # itself uses the iso3166_2 area filter for accuracy.

