name: gmaps payment enrichment

# Daily secondary-source enrichment. For features that have no `payment`
# block, query gosom by name + coords, parse the German "Zahlungen"
# section out of gosom's About[] array, write back as tri-state values.
#
# Throttled to 100 features per run by default — gosom is ~8-10s per
# query so a run takes ~25-30 min. Tune via the `batch` input on manual
# dispatch.
#
# ToS posture acknowledged: this runs sustained against Google's edge
# from a GH Actions runner IP. Failure modes (rate limit, CAPTCHA gate)
# degrade gracefully — the script just records no_match / errored.

on:
  schedule:
    # 03:23 UTC daily — off-peak, away from osm-scrape (Mon 04:17).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many features to enrich (default 100)"
        required: false
        default: ""
      region:
        description: "Region slug to constrain to (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gmaps-payment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run gmaps payment enrichment
        id: enrich
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.batch }}" ]; then
            args+=(--batch "${{ inputs.batch }}")
          fi
          if [ -n "${{ inputs.region }}" ]; then
            args+=(--region "${{ inputs.region }}")
          fi
          echo "Running: bun scripts/run-gmaps-payment.ts ${args[*]}"
          bun scripts/run-gmaps-payment.ts "${args[@]}" > gmaps-payment-stats.json
          cat gmaps-payment-stats.json
          {
            echo "title=$(jq -r '"+\(.written) payment blocks (matched \(.matched)/\(.queried), \(.no_match) no-match, \(.errored) errored)"' gmaps-payment-stats.json)"
            echo 'stats<<JSON'
            cat gmaps-payment-stats.json
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ | head -30
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Gmaps payment: ${{ steps.enrich.outputs.title }}"
          title: "Gmaps payment: ${{ steps.enrich.outputs.title }}"
          branch: gmaps-payment/automated
          delete-branch: true
          body: |
            Automated Google-Maps secondary-source enrichment. Filled in
            `payment` blocks on features that had none, derived from
            gosom's `About → Zahlungen` section.

            Each affected feature gains a `{ "type": "gmaps", "id": "payment" }`
            entry in `sources[]` so the provenance is traceable.

            **Stats**:
            ```json
            ${{ steps.enrich.outputs.stats }}
            ```

            Manual review encouraged on first runs — spot-check that the
            written values agree with what Google Maps shows for the
            kiosk. Subsequent runs only touch features that are still
            without payment, so re-runs are idempotent.
          labels: |
            gmaps
            payment
            automated
          add-paths: |
            data/
