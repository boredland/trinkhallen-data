name: id-resolve (bulk)

# One-shot fan-out for the Apple Maps place-id backfill. Per-region matrix,
# each job walks its region's geojson and stamps `{type:"apple",id:...}`
# onto every feature that doesn't have one yet.
#
# Google place_ids arrive as a side-effect of gmaps-payment-bulk.yml —
# this workflow no longer touches them. See PR #93 for the convention,
# and the apple-only refactor that dropped gosom from id-resolve.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to process (or 'all' for the full fan-out)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - aachen
          - augsburg
          - berlin
          - bielefeld
          - bremen
          - bremerhaven
          - chemnitz
          - cottbus
          - dresden
          - duesseldorf
          - erfurt
          - frankfurt
          - freiburg
          - goettingen
          - halle
          - hamburg
          - hannover
          - hildesheim
          - ingolstadt
          - karlsruhe
          - kassel
          - kiel
          - koblenz
          - koeln
          - leipzig
          - luebeck
          - magdeburg
          - mainz
          - mannheim
          - muenchen
          - muenster
          - nuernberg
          - osnabrueck
          - potsdam
          - regensburg
          - remscheid
          - reutlingen
          - rostock
          - ruhr
          - saarbruecken
          - salzgitter
          - siegen
          - stuttgart
          - trier
          - ulm
          - wolfsburg
          - wuerzburg

permissions:
  contents: write
  pull-requests: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          if [ "${{ inputs.region }}" = "all" ]; then
            regions=$(find data/de -name '*.geojson' \
              | sed 's|.*/||;s|\.geojson$||' \
              | sort -u | jq -R . | jq -sc .)
          else
            regions=$(jq -nc --arg r "${{ inputs.region }}" '[$r]')
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Will process: $regions"

  resolve:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.enumerate.outputs.regions) }}
    concurrency:
      group: id-resolve-bulk-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Resolve IDs
        id: resolve
        run: |
          set -euo pipefail
          bun scripts/run-id-resolve.ts \
            --region "${{ matrix.region }}" \
            --batch 99999 \
            --max-runtime-min 300 \
            > stats-${{ matrix.region }}.json
          cat stats-${{ matrix.region }}.json

      - name: Detect changes
        id: diff
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          stats_file="stats-${{ matrix.region }}.json"
          if [ -s "$stats_file" ]; then
            suffix=$(jq -r '
              "+\(.resolved // 0) apple " +
              "(\(.queried // 0) queried, \(.no_match // 0) no-match, \(.errored // 0) errored)" +
              (if (.stopped_reason // "") == "max_runtime" or (.stopped_reason // "") == "sigterm"
               then " — partial (\(.stopped_reason))"
               else "" end)
            ' "$stats_file")
          else
            suffix="(partial — runner cancelled before stats flush)"
          fi
          echo "title=ID resolve (${{ matrix.region }}): $suffix" >> "$GITHUB_OUTPUT"
          {
            echo 'stats<<JSON'
            if [ -s "$stats_file" ]; then
              cat "$stats_file"
            else
              echo '{ "note": "stats file missing — resolve step was cancelled before flushing" }'
            fi
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: always() && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ steps.diff.outputs.title }}
          title: ${{ steps.diff.outputs.title }}
          branch: id-resolve/bulk-${{ matrix.region }}
          delete-branch: true
          body: |
            Apple Maps place-id backfill for `${{ matrix.region }}` — stamps
            `{type:"apple",id:...}` onto features that didn't already carry
            one. Source: DuckDuckGo `local.js` (`provider_meta.apple.place_id`).
            Google place_ids arrive separately via gmaps-payment-bulk.

            ```json
            ${{ steps.diff.outputs.stats }}
            ```
          labels: |
            id-resolve
            automated
            bulk
          add-paths: |
            data/
