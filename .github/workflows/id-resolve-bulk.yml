name: id-resolve (bulk)

# One-shot fan-out for the external-ID backfill. Per-region matrix, each job
# walks its region's geojson and stamps `{type:"gmaps",id:...}` +
# `{type:"apple",id:...}` onto every feature that doesn't have them yet.
#
# Mirrors the resilience patterns from gmaps-payment-bulk.yml: --max-runtime-min
# bound on the script, SIGTERM trap, incremental flush, and `if: always()`
# follow-up steps so a runner-timeout cancellation still produces a PR with
# the partial progress.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region slugs (empty = all)"
        required: false
        default: ""
      only:
        description: "Limit to a single slot: gmaps | apple (empty = both)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.regions }}" ]; then
            regions=$(echo "${{ inputs.regions }}" | tr ',' '\n' | jq -R . | jq -sc .)
          else
            regions=$(find data/de -name '*.geojson' \
              | sed 's|.*/||;s|\.geojson$||' \
              | sort -u | jq -R . | jq -sc .)
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Will process: $regions"

  resolve:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.enumerate.outputs.regions) }}
    concurrency:
      group: id-resolve-bulk-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Resolve IDs
        id: resolve
        run: |
          set -euo pipefail
          extra=""
          if [ -n "${{ inputs.only }}" ]; then
            extra="--only ${{ inputs.only }}"
          fi
          bun scripts/run-id-resolve.ts \
            --region "${{ matrix.region }}" \
            --batch 99999 \
            --max-runtime-min 300 \
            $extra \
            > stats-${{ matrix.region }}.json
          cat stats-${{ matrix.region }}.json

      - name: Detect changes
        id: diff
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          stats_file="stats-${{ matrix.region }}.json"
          if [ -s "$stats_file" ]; then
            suffix=$(jq -r '
              "+\(.gmaps_resolved // 0) gmaps +\(.apple_resolved // 0) apple " +
              "(\(.needs_gmaps // 0)/\(.needs_apple // 0) needed)" +
              (if (.stopped_reason // "") == "max_runtime" or (.stopped_reason // "") == "sigterm"
               then " — partial (\(.stopped_reason))"
               else "" end)
            ' "$stats_file")
          else
            suffix="(partial — runner cancelled before stats flush)"
          fi
          echo "title=ID resolve (${{ matrix.region }}): $suffix" >> "$GITHUB_OUTPUT"
          {
            echo 'stats<<JSON'
            if [ -s "$stats_file" ]; then
              cat "$stats_file"
            else
              echo '{ "note": "stats file missing — resolve step was cancelled before flushing" }'
            fi
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: always() && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ steps.diff.outputs.title }}
          title: ${{ steps.diff.outputs.title }}
          branch: id-resolve/bulk-${{ matrix.region }}
          delete-branch: true
          body: |
            External-ID backfill for `${{ matrix.region }}` — stamps Google
            `place_id` and Apple `place_id` onto every feature that didn't
            already have them. Downstream enrichment workflows can use these
            ids to skip the name+coord search step entirely.

            ```json
            ${{ steps.diff.outputs.stats }}
            ```
          labels: |
            id-resolve
            automated
            bulk
          add-paths: |
            data/
