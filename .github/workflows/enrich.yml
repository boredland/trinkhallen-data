name: enrich
run-name: enrich · ${{ inputs.region || 'random' }}

# Per-feature payment + hours enrichment for one region. Apple-first
# (DuckDuckGo place_id → maps.apple.com SSR → amenityV2 + businessHours),
# then gosom (Google Maps) fills anything Apple didn't cover. Both
# merges are conservative — nothing existing gets overwritten.
#
# The script throttles each upstream with its own p-queue. Six features
# are processed concurrently; SIGTERM and --max-runtime-min both stop
# new work and flush in-flight progress so the PR step always sees
# whatever landed.
#
# Daily cron picks a random region. The job times out at 60 minutes and
# `if: always()` on the follow-up steps means a partial run still opens
# a PR.

on:
  schedule:
    # Hourly at :17 — off-the-minute to avoid GH's top-of-hour
    # thundering herd. The 55-min job timeout + 45-min script budget
    # leave a comfortable gap before the next tick's run.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      region:
        # Free-form string instead of `type: choice` — the dropdown was
        # a hand-maintained list of 47 city slugs that silently fell out
        # of sync with regions.yml every time we added a region.
        # 'random' resolves below by reading regions.yml directly.
        description: "Region slug (or 'random' to roll one from regions.yml)"
        required: true
        default: "random"
        type: string
      max_runtime_min:
        description: "Script's --max-runtime-min budget. Job timeout is this + 10 min headroom."
        required: false
        default: "45"
        type: string
      batch:
        description: "Cap the number of features queried this run. Empty = no cap."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Split out so the enrich job's `concurrency.group` can reference the
  # resolved region via `needs.pick.outputs.region`. Workflow-level
  # `concurrency:` would be evaluated before any step runs, so it can't
  # see the cron's random pick. Job-level concurrency on `enrich`
  # depending on `pick`'s output gives us per-region serialisation: two
  # runs targeting the same region queue up; runs for different regions
  # proceed in parallel.
  pick:
    runs-on: ubuntu-latest
    outputs:
      region: ${{ steps.choose.outputs.region }}
      # Job timeout = script budget + 10 min headroom for in-flight drain
      # + wrap-up steps. Computed in bash because GH expressions don't
      # support arithmetic.
      timeout_min: ${{ steps.choose.outputs.timeout_min }}
    steps:
      - uses: actions/checkout@v6
      - id: choose
        run: |
          set -euo pipefail
          choice="${{ inputs.region }}"
          if [ -z "$choice" ] || [ "$choice" = "random" ]; then
            # Pick from regions.yml slugs (was: file basenames under
            # data/de, which broke once every Bundesland had a `_rest.geojson`
            # that all reduce to the literal string `_rest`). Grep keeps
            # this dependency-free so the pick job doesn't have to run
            # `bun install` before deciding what to enrich.
            choice=$(grep -E '^\s+- slug:' regions.yml | awk '{print $NF}' | shuf -n 1)
          fi
          echo "region=$choice" >> "$GITHUB_OUTPUT"
          echo "Picked: $choice"

          max_runtime_min="${{ inputs.max_runtime_min }}"
          : "${max_runtime_min:=45}"
          timeout_min=$((max_runtime_min + 10))
          echo "timeout_min=$timeout_min" >> "$GITHUB_OUTPUT"
          echo "Job timeout: ${timeout_min}m (script budget ${max_runtime_min}m + 10m headroom)"

  enrich:
    needs: pick
    name: enrich · ${{ needs.pick.outputs.region }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.pick.outputs.timeout_min) }}
    concurrency:
      group: enrich-${{ needs.pick.outputs.region }}
      cancel-in-progress: false
    # Persistent gosom sidecar so each Google fallback call is a
    # POST → poll → CSV-download against localhost:8080 instead of a
    # per-call `docker run`. GitHub waits for the health-cmd to pass
    # before starting any step. gosom's web mode has no /health
    # endpoint and the image ships no curl/wget, so we use bash's
    # built-in /dev/tcp test (bash 5.2 is in the gosom image's
    # debian:trixie-slim base).
    services:
      gosom:
        image: gosom/google-maps-scraper
        # `-c 2` = in-job concurrency. We kept this low: Google rate-
        # limits aggressively when 4 parallel pages are scraping at
        # once from one IP — chunks stall mid-job. 2 pages share the
        # one warm browser and stay under the throttle threshold for
        # longer.
        command: -data-folder /gmapsdata -c 2
        ports:
          - 8080:8080
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/8080'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 60
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Enrich
        id: enrich
        run: |
          set -euo pipefail
          args=(
            --region "${{ needs.pick.outputs.region }}"
            --max-runtime-min "${{ inputs.max_runtime_min || '45' }}"
          )
          if [ -n "${{ inputs.batch }}" ]; then
            args+=(--batch "${{ inputs.batch }}")
          fi
          echo "Running: bun scripts/run-enrich.ts ${args[*]}"
          bun scripts/run-enrich.ts "${args[@]}" > stats.json
          cat stats.json

      - name: Detect changes
        id: diff
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ | head -30
          fi

          if [ -s stats.json ]; then
            suffix=$(jq -r '
              "+\(.payment_keys_written // 0) payment keys, +\(.hours_written // 0) hours, +\(.ids_resolved // 0) place-ids " +
              "(apple=\(.apple_features_touched // 0) google=\(.google_features_touched // 0))" +
              (if (.stopped_reason // "") == "max_runtime" or (.stopped_reason // "") == "sigterm"
               then " — partial (\(.stopped_reason))"
               else "" end)
            ' stats.json)
          else
            suffix="(partial — stats file missing)"
          fi
          echo "title=Enrich (${{ needs.pick.outputs.region }}): $suffix" >> "$GITHUB_OUTPUT"
          {
            echo 'stats<<JSON'
            if [ -s stats.json ]; then cat stats.json; else echo '{ "note": "stats missing" }'; fi
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Commit to main
        if: always() && steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Multi-line commit message — title line + stats JSON block.
          {
            echo "${{ steps.diff.outputs.title }}"
            echo
            echo '```json'
            if [ -s stats.json ]; then cat stats.json; fi
            echo '```'
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # Concurrent enrich runs for different regions touch different
          # files, but two runs that land on the *same* region's geojson
          # (e.g. when many were dispatched at once) hit a real content
          # conflict. `-X theirs` during rebase favours the commit being
          # replayed — our just-enriched data — over upstream. Any keys
          # the other run also filled will simply be re-detected next
          # time the region cycles (enrichment is idempotent).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, pulling --rebase -X theirs (attempt $i)"
            if ! git pull --rebase -X theirs --autostash; then
              # `-X theirs` resolves text conflicts but a tree-level
              # conflict (rename/delete) still halts. Abort and bail
              # rather than leaving the repo mid-rebase for the next
              # iteration to trip over.
              git rebase --abort || true
              echo "rebase aborted on attempt $i"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1
