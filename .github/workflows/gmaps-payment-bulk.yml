name: gmaps payment enrichment (bulk)

# One-shot fan-out for the gmaps payment backfill. Enumerates every
# region under data/de/*/*.geojson and runs the enrichment script per
# region in parallel, each producing its own PR. The daily cron workflow
# (`gmaps-payment.yml`) handles ongoing trickle; this one exists to
# close the initial gap (~12k features missing payment as of bootstrap).
#
# Per-region jobs use a 6h timeout (GitHub's max for free runners).
# Frankfurt is the slowest at ~4h; everything else finishes in under
# 3h. Total wall-clock depends on free-tier concurrency (typically
# 20 parallel jobs).
#
# The script bounds its own wall-clock with --max-runtime-min (set
# below ~320 min) and traps SIGTERM, so big regions exit cleanly with
# partial progress instead of getting SIGKILLed at the job timeout and
# losing every queried feature. Features that the script queried but
# didn't return useful payment data get a `payment_attempted` stamp;
# subsequent runs skip them for 30 days, so each re-dispatch converges.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region slugs (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.regions }}" ]; then
            regions=$(echo "${{ inputs.regions }}" | tr ',' '\n' | jq -R . | jq -sc .)
          else
            regions=$(find data/de -name '*.geojson' \
              | sed 's|.*/||;s|\.geojson$||' \
              | sort -u | jq -R . | jq -sc .)
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Will process: $regions"

  enrich:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.enumerate.outputs.regions) }}
    concurrency:
      group: gmaps-payment-bulk-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Enrich region
        id: enrich
        run: |
          set -euo pipefail
          bun scripts/run-gmaps-payment.ts \
            --region "${{ matrix.region }}" \
            --batch 99999 \
            --max-runtime-min 320 \
            > stats-${{ matrix.region }}.json
          cat stats-${{ matrix.region }}.json
          {
            echo "title=Gmaps payment (${{ matrix.region }}): $(jq -r '"+\(.written) blocks (\(.matched)/\(.queried) matched)"' stats-${{ matrix.region }}.json)"
            echo 'stats<<JSON'
            cat stats-${{ matrix.region }}.json
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ steps.enrich.outputs.title }}
          title: ${{ steps.enrich.outputs.title }}
          branch: gmaps-payment/bulk-${{ matrix.region }}
          delete-branch: true
          body: |
            Bulk gmaps payment backfill for `${{ matrix.region }}`.

            ```json
            ${{ steps.enrich.outputs.stats }}
            ```
          labels: |
            gmaps
            payment
            automated
            bulk
          add-paths: |
            data/
