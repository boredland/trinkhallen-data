name: gmaps payment enrichment (bulk)

# One-shot fan-out for the gmaps payment backfill. Enumerates every
# region under data/de/*/*.geojson and runs the enrichment script per
# region in parallel, each producing its own PR. The daily cron workflow
# (`gmaps-payment.yml`) handles ongoing trickle; this one exists to
# close the initial gap (~12k features missing payment as of bootstrap).
#
# Per-region jobs use a 6h timeout (GitHub's max for free runners).
# Frankfurt is the slowest at ~4h; everything else finishes in under
# 3h. Total wall-clock depends on free-tier concurrency (typically
# 20 parallel jobs).
#
# The script bounds its own wall-clock with --max-runtime-min (set
# below ~300 min) and traps SIGTERM, so big regions exit cleanly with
# partial progress instead of getting SIGKILLed at the job timeout and
# losing every queried feature. Features that the script queried but
# didn't return useful payment data get a `payment_attempted` stamp;
# subsequent runs skip them for 30 days, so each re-dispatch converges.
#
# The follow-up steps (Detect changes, Open PR) run with `if: always()`
# so a PR still opens when the runner classifies the enrich step as
# cancelled (which happens whenever GH's job timeout fires, even though
# the script tries to land well under it). The PR title + stats body are
# computed in the diff step from the stats-*.json file on disk so they
# survive an enrich-step cancellation too.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region slugs (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.regions }}" ]; then
            regions=$(echo "${{ inputs.regions }}" | tr ',' '\n' | jq -R . | jq -sc .)
          else
            regions=$(find data/de -name '*.geojson' \
              | sed 's|.*/||;s|\.geojson$||' \
              | sort -u | jq -R . | jq -sc .)
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Will process: $regions"

  enrich:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.enumerate.outputs.regions) }}
    concurrency:
      group: gmaps-payment-bulk-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Enrich region
        id: enrich
        run: |
          set -euo pipefail
          bun scripts/run-gmaps-payment.ts \
            --region "${{ matrix.region }}" \
            --batch 99999 \
            --max-runtime-min 300 \
            > stats-${{ matrix.region }}.json
          cat stats-${{ matrix.region }}.json

      - name: Detect changes
        id: diff
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          # Compute title + stats body here (not in the enrich step) so they
          # survive an enrich-step cancellation. The stats file is written
          # incrementally by the script; if the runner killed the script
          # before any flush, the file is missing and we surface that.
          stats_file="stats-${{ matrix.region }}.json"
          if [ -s "$stats_file" ]; then
            suffix=$(jq -r '
              "+\(.written // 0) blocks (\(.matched // 0)/\(.queried // 0) matched)" +
              (if (.stopped_reason // "" ) == "max_runtime" or (.stopped_reason // "") == "sigterm"
               then " — partial (\(.stopped_reason))"
               else "" end)
            ' "$stats_file")
          else
            suffix="(partial — runner cancelled before stats flush)"
          fi
          echo "title=Gmaps payment (${{ matrix.region }}): $suffix" >> "$GITHUB_OUTPUT"
          {
            echo 'stats<<JSON'
            if [ -s "$stats_file" ]; then
              cat "$stats_file"
            else
              echo '{ "note": "stats file missing — enrich step was cancelled before flushing" }'
            fi
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: always() && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ steps.diff.outputs.title }}
          title: ${{ steps.diff.outputs.title }}
          branch: gmaps-payment/bulk-${{ matrix.region }}
          delete-branch: true
          body: |
            Bulk gmaps payment backfill for `${{ matrix.region }}`.

            ```json
            ${{ steps.diff.outputs.stats }}
            ```
          labels: |
            gmaps
            payment
            automated
            bulk
          add-paths: |
            data/
