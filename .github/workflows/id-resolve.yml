name: id-resolve

# Daily trickle that resolves missing Google + Apple Maps ids for kiosks
# without them. Companion to gmaps-payment.yml and the eventual apple
# enrichment — once a feature has its ids stamped, downstream workflows can
# use them directly instead of repeating the name+coord search.
#
# Throttled to 100 features per run by default. Apple lookups are HTTP-only
# (~1s/feature including sleep); the gmaps slot uses gosom (~10-15s) so a
# full run with both slots is ~15-25 min per 100 features.

on:
  schedule:
    # 04:47 UTC daily — off-peak, after gmaps-payment (03:23) so any new
    # gmaps ids from the payment run get a sibling apple lookup the next day.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many features to resolve (default 100)"
        required: false
        default: ""
      region:
        description: "Region slug to constrain to (empty = all)"
        required: false
        default: ""
      only:
        description: "Limit to a single slot: gmaps | apple (empty = both)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: id-resolve
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run id-resolve
        id: resolve
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.batch }}" ]; then
            args+=(--batch "${{ inputs.batch }}")
          fi
          if [ -n "${{ inputs.region }}" ]; then
            args+=(--region "${{ inputs.region }}")
          fi
          if [ -n "${{ inputs.only }}" ]; then
            args+=(--only "${{ inputs.only }}")
          fi
          echo "Running: bun scripts/run-id-resolve.ts ${args[*]}"
          bun scripts/run-id-resolve.ts "${args[@]}" > id-resolve-stats.json
          cat id-resolve-stats.json
          {
            echo "title=$(jq -r '"+\(.gmaps_resolved) gmaps +\(.apple_resolved) apple (\(.needs_gmaps)/\(.needs_apple) needed)"' id-resolve-stats.json)"
            echo 'stats<<JSON'
            cat id-resolve-stats.json
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ | head -30
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "ID resolve: ${{ steps.resolve.outputs.title }}"
          title: "ID resolve: ${{ steps.resolve.outputs.title }}"
          branch: id-resolve/automated
          delete-branch: true
          body: |
            Automated external-ID resolver. Stamps `{type:"gmaps",id:...}`
            and `{type:"apple",id:...}` onto features that don't yet carry
            them. No data enrichment — just the ids, so downstream payment /
            amenity workflows can skip the name+coord search step.

            **Sources**: gosom (Google) + DuckDuckGo `local.js` (Apple).

            **Stats**:
            ```json
            ${{ steps.resolve.outputs.stats }}
            ```
          labels: |
            id-resolve
            automated
          add-paths: |
            data/
