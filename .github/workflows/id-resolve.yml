name: id-resolve

# Daily trickle for Apple Maps place-id resolution. Companion to
# gmaps-payment.yml — once a feature has both ids, downstream
# enrichment workflows can address it directly instead of repeating the
# name+coord search.
#
# Apple-only since the apple-only refactor (PR after #96): Google
# place_ids accumulate naturally from run-gmaps-payment.ts's
# side-effect, so a dedicated gosom pass here is wasted work.
# ~1 s per feature; a full run with batch=100 is ~2 min wall-clock.

on:
  schedule:
    # 04:47 UTC daily — off-peak, after gmaps-payment (03:23) so any new
    # features that got a gmaps id from the payment run get an Apple lookup
    # the next morning.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many features to resolve (default 100)"
        required: false
        default: ""
      region:
        description: "Region to process (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - aachen
          - augsburg
          - berlin
          - bielefeld
          - bremen
          - bremerhaven
          - chemnitz
          - cottbus
          - dresden
          - duesseldorf
          - erfurt
          - frankfurt
          - freiburg
          - goettingen
          - halle
          - hamburg
          - hannover
          - hildesheim
          - ingolstadt
          - karlsruhe
          - kassel
          - kiel
          - koblenz
          - koeln
          - leipzig
          - luebeck
          - magdeburg
          - mainz
          - mannheim
          - muenchen
          - muenster
          - nuernberg
          - osnabrueck
          - potsdam
          - regensburg
          - remscheid
          - reutlingen
          - rostock
          - ruhr
          - saarbruecken
          - salzgitter
          - siegen
          - stuttgart
          - trier
          - ulm
          - wolfsburg
          - wuerzburg

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: id-resolve
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run id-resolve
        id: resolve
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.batch }}" ]; then
            args+=(--batch "${{ inputs.batch }}")
          fi
          if [ -n "${{ inputs.region }}" ] && [ "${{ inputs.region }}" != "all" ]; then
            args+=(--region "${{ inputs.region }}")
          fi
          echo "Running: bun scripts/run-id-resolve.ts ${args[*]}"
          bun scripts/run-id-resolve.ts "${args[@]}" > id-resolve-stats.json
          cat id-resolve-stats.json
          {
            echo "title=$(jq -r '"+\(.resolved) apple (\(.queried) queried, \(.no_match) no-match, \(.errored) errored)"' id-resolve-stats.json)"
            echo 'stats<<JSON'
            cat id-resolve-stats.json
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ | head -30
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "ID resolve: ${{ steps.resolve.outputs.title }}"
          title: "ID resolve: ${{ steps.resolve.outputs.title }}"
          branch: id-resolve/automated
          delete-branch: true
          body: |
            Daily Apple Maps place-id resolver. Stamps `{type:"apple",id:...}`
            onto features that don't yet carry one. Source: DuckDuckGo
            `local.js`.

            **Stats**:
            ```json
            ${{ steps.resolve.outputs.stats }}
            ```
          labels: |
            id-resolve
            automated
          add-paths: |
            data/
