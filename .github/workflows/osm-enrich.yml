name: OSM enrichment

on:
  # Monthly — running more often is wasted Overpass courtesy. The weekly
  # osm-scrape workflow handles drift; this one fills blanks on the
  # human-curated features that don't yet have an OSM source.
  schedule:
    - cron: "37 5 1 * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Region slug to enrich (empty = all)"
        required: false
        default: ""
      since:
        description: "Only enrich features created/updated since this date (YYYY-MM-DD). Empty = 40 days ago (default), or set 'full' below."
        required: false
        default: ""
      full:
        description: "Full sweep — ignore the date filter entirely. Slow, use sparingly."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: osm-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # extra room for the gosom step (per-row gmaps queries)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run enrichment
        id: enrich
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.region }}" ]; then
            args+=(--region "${{ inputs.region }}")
          fi
          # Date filter precedence: --full flag wins; else explicit `since`
          # input; else default to 40 days ago (catches the last cron's
          # additions with a safety margin).
          if [ "${{ inputs.full }}" = "true" ]; then
            args+=(--full)
          elif [ -n "${{ inputs.since }}" ]; then
            args+=(--since "${{ inputs.since }}")
          else
            args+=(--since "$(date -d '40 days ago' --iso-8601)")
          fi
          echo "Running: bun scripts/enrich-from-osm.ts ${args[*]}"
          bun scripts/enrich-from-osm.ts "${args[@]}" > enrich-stats.json
          cat enrich-stats.json
          {
            echo "title=$(jq -r '"matched \(.matched), filled \(.hours) hours / \(.payment) pay / \(.address) addr / \(.tags) tags"' enrich-stats.json)"
            echo 'stats<<JSON'
            cat enrich-stats.json
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

      # Free-tier confirmation of uncertain rows via the gosom/google-maps-scraper
      # docker image. Skipped automatically when the enrich step produced no
      # uncertain rows. Failures are non-fatal: the script just leaves rows in
      # the CSV for human review.
      - name: Confirm uncertain via Google Maps
        id: gmaps
        if: hashFiles('_enrichment-uncertain.csv') != ''
        continue-on-error: true
        run: |
          set -eo pipefail
          bun scripts/run-gmaps-confirm.ts | tee gmaps-stats.json

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/ _enrichment-conflicts.csv _enrichment-uncertain.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ _enrichment-*.csv | head -30
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "OSM enrichment: ${{ steps.enrich.outputs.title }}"
          title: "OSM enrichment: ${{ steps.enrich.outputs.title }}"
          branch: osm-enrich/automated
          delete-branch: true
          body: |
            Automated OSM enrichment run — backfills `hours`, `payment.*`,
            `address.*` and inferred `tags[]` from matched OSM POIs.

            **Matching rules** (see `scripts/enrich-from-osm.ts`):
            - Candidates within 25 m
            - Combined score = 0.55 × Sørensen-Dice(name bigrams) + 0.45 × distance score
            - Auto-accept ≥ 0.7, uncertain ≥ 0.45 (logged to CSV, not applied)

            **Enrichment stats**:
            ```json
            ${{ steps.enrich.outputs.stats }}
            ```

            **Google Maps confirmation stats** (uncertain → confirmed via gosom):
            run gmaps step output in `gmaps-stats.json` (committed to branch when present).

            **For review**:
            - `_enrichment-uncertain.csv` — sub-threshold candidates (judge per-row)
            - `_enrichment-conflicts.csv` — OSM disagrees with values we already had

            Re-merging this PR after manual tweaks: edit the relevant geojson
            and force-push, or close and re-run the workflow.
          labels: |
            osm
            enrichment
            automated
          add-paths: |
            data/
            _enrichment-uncertain.csv
